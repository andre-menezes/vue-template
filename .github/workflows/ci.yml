# Pipeline de CI — vue3-template
#
# Jobs: lint, build (typecheck + build), test (unitários + cobertura) e e2e
# (Playwright). A versão do Node segue a fixada em .nvmrc / .tool-versions, e a
# do pnpm, o campo `packageManager` do package.json (ADR-0024).
#
# Cada job faz o checkout e chama a action local `.github/actions/setup`
# (pnpm, Node e dependências). Actions de terceiros ficam fixadas pelo SHA do
# commit, com a versão no comentário; o Dependabot propõe as atualizações
# (ADR-0034, ADR-0035).

name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# Cancela execuções anteriores da mesma branch/PR ao receber um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm lint

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # O `webServer` do playwright.config.ts sobe o Vite no modo `test`.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
