# Pipeline de CI — vue3-template
#
# Estágios: install -> lint -> build -> test -> deploy (GitLab Pages).
#
# A imagem do Node segue a versão exata fixada em .tool-versions / .nvmrc.

image: node:24.22.2

stages:
  - install
  - lint
  - build
  - test
  - deploy

# Cache das dependências entre jobs, chaveado pelo lockfile.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull

# Executa o pipeline em MRs e nas branches principais, evitando duplicidade.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# Instala dependências uma vez e popula o cache para os jobs seguintes.
install:
  stage: install
  script:
    - npm ci --no-audit --no-fund
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
    policy: pull-push

lint:
  stage: lint
  needs:
    - install
  script:
    - npm run lint

build:
  stage: build
  needs:
    - install
  script:
    - npm run build
  artifacts:
    name: 'dist-$CI_COMMIT_SHORT_SHA'
    paths:
      - dist/
    expire_in: 1 week

test:
  stage: test
  needs:
    - install
  # As variáveis VITE_* exigidas por `@core/config` vêm do `.env.test`
  # versionado (carregado automaticamente pelo Vitest no modo `test`).
  script:
    - npm run test:coverage
  coverage: '/^All files\s+\|\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

# Testes E2E (Playwright + Chromium). O `webServer` do playwright.config.ts
# sobe o Vite no modo `test` com o mock de autenticação ligado.
e2e:
  stage: test
  needs:
    - install
  script:
    # A imagem node é Debian: instala o Chromium e as libs de sistema dele.
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

# Publica o build do Vue 3 no GitLab Pages
pages:
  stage: deploy
  needs:
    - build
  script:
    # O GitLab Pages exige que os arquivos fiquem em uma pasta chamada 'public'
    - mkdir -p public
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  rules:
    # Publica automaticamente apenas quando houver commit na branch main (ou altere para a sua branch padrão)
    - if: '$CI_COMMIT_BRANCH == "main"'
